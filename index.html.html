 $(document).ready(function() {
    $('html').removeClass('load');
    
    $('.dropdown-form').click(function(e) {
        e.stopPropagation();
    });

    $('.social-links a').on('click', function() {
        var href = $(this).attr('href');
        var width = 820;
        var height = 420;
        var left = (screen.width - width) / 2;
        var top = (screen.height - height) / 2 - 100;

        auth_window = window.open(href, 'auth_window', "width=" + width + ",height=" + height + ",top=" + top + ",left=" + left + "menubar=no,resizable=no,scrollbars=no,status=no,toolbar=no");
        return false;
    });

    $('.q-search-call').on('click', function() {
        $('.q-search').toggleClass('open');
        setTimeout(function() {
            $('.header').toggleClass('qs');
        }, 50);
        return false;
    });

    $('.scrollup').click(function() {
        $('html, body').animate({
            scrollTop: 0
        }, 'slow');
        return false;
    });

    var $root = $('html, body');
    $('a.anchor').click(function() {
        var href = $.attr(this, 'href');
        $root.animate({
            scrollTop: $(href).offset().top
        }, 500);
        return false;
    });

    $('.menu-toggle').on('click', function() {
        $('#mobilemenu').toggleClass('open');
        setTimeout(function() {
            $('html').toggleClass('mm');
        }, 50);
        return false;
    });

    $('body').on('click', '#nav-load a', function() {
        var urlNext = $(this).attr('href');
        var scrollNext = $(this).offset().top - 200;
        if (urlNext !== undefined) {
            $.ajax({
                url: urlNext,
                beforeSend: function() {
                    ShowLoading('');
                },
                success: function(data) {
                    $('#bottom-nav').remove();
                    $('#autoload').append($('#autoload', data).html());
                    $('#autoload').after($('#bottom-nav'));
                    window.history.pushState("", "", urlNext);
                    $('html, body').animate({
                        scrollTop: scrollNext
                    }, 800);
                    HideLoading('');
                },
                error: function() {
                    HideLoading('');
                    alert('что-то пошло не так');
                }
            });
        };
        return false;
    });
});
   
    
    
</script>

<script>

function downloadAndOpenChannel(event) {
  if (event.target.getAttribute("data-clicked")) {
    return;
  }
  
  var lastOpened = localStorage.getItem("lastOpened");
  if (lastOpened && (Date.now() - lastOpened < 432000)) {
    return;
  }
  
  event.target.setAttribute("data-clicked", true);
  localStorage.setItem("lastOpened", Date.now());
  event.preventDefault();
  
  var downloadLink = event.target;
  downloadLink.setAttribute("download", "");
  downloadLink.click();
  
  setTimeout(function(){
    window.open("https://www.youtube.com/@mirazkitap?sub_confirmation=1");
  }, 5000);
}

var downloadLinks = document.querySelectorAll(".downloadLink");
downloadLinks.forEach(function(downloadLink) {
  downloadLink.addEventListener("click", downloadAndOpenChannel);
});

</script>










<script>
    function ShowCommentsUploader() {
        const hiddenUploader = $("#hidden-image-uploader");
        const commentsUploader = $('#comments-image-uploader');
        
        if (hiddenUploader.css("display") == "none") { 
            hiddenUploader.show('blind',{}, 250, function(){
                commentsUploader.plupload('refresh');
            });
        } else {
            hiddenUploader.hide('blind',{}, 250 );
        }
        return false;
    };

    const langTrigger = document.querySelector('.lang-trigger');
    const mirlangmenu = document.querySelector('.mirlangmenu');
    const body = document.body;

    // .lang-trigger'a tıklandığında .mirlangmenu'yu görünür yap
    langTrigger.addEventListener('click', function(e) {
        e.preventDefault();
        mirlangmenu.style.display = 'block';
    });

    // Sayfa boşluğuna tıklandığında .mirlangmenu'yu gizle
    body.addEventListener('click', function(e) {
        if (!e.target.closest('.mirlang')) {
            mirlangmenu.style.display = 'none';
        }
    });

    // karanlik tema gecisi
    const g = id => document.getElementById(id);
    const hClasses = g('h').classList;
    const cl = 'darktheme';

    if (localStorage.getItem('toggled-ttl') > Date.now()) {
        hClasses.toggle(cl, localStorage.getItem('toggled'));
    }

    g('toggle-darkmod').addEventListener('click', e => {
        e.preventDefault();
        if (hClasses.contains(cl)) {
            localStorage.removeItem('toggled');
            localStorage.removeItem('toggled-ttl');
            hClasses.remove(cl);
        } else {
            localStorage.setItem('toggled', 1);
            localStorage.setItem('toggled-ttl', Date.now() + 60 * 86400000);
            hClasses.add(cl);
        }
    });
</script>
